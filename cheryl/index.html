<style>:root{--paper:#f4f3f0;--card:#fff;--ink:#15130f;--ink-2:#58544c;--line:#dcd8cf;--field:#8f8a80;--gold:#d39e1c;--gold-text:#87610c;--err:#b3261e;--shadow:0 1px 2px rgba(21,19,15,.06),0 10px 30px rgba(21,19,15,.07);--cond:"DIN Condensed","Barlow Condensed","Arial Narrow",sans-serif;--sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#121110;--card:#1c1a17;--ink:#f2efe8;--ink-2:#b8b2a7;--line:#34302a;--field:#7c766c;--gold:#dcaa32;--gold-text:#e6b947;--err:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
main{width:100%;max-width:420px;display:grid;gap:12px}
.mark{justify-self:center;display:flex;align-items:center;gap:10px;font:700 24px/1 var(--cond);letter-spacing:.06em;margin-bottom:6px}.mark i{display:block;width:28px;height:2px;background:var(--gold)}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.k{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
h1{margin:0;font:700 30px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:10px}h1 svg{width:20px;height:20px;color:var(--gold-text);flex:none}
.sub{margin:6px 0 18px;color:var(--ink-2);font-size:16px}
label.f{display:block;font:600 14px/1 var(--sans);letter-spacing:.04em;margin-bottom:8px}
.pw{position:relative}.pw input{width:100%;font:500 18px/1.2 var(--sans);color:var(--ink);background:transparent;border:1.5px solid var(--field);border-radius:12px;padding:15px 68px 15px 14px;min-height:56px}
.pw input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-color:var(--ink)}.pw input[aria-invalid=true]{border-color:var(--err)}
.pw .eye{position:absolute;right:4px;top:4px;bottom:4px;min-width:60px;border:0;background:transparent;color:var(--ink-2);font:600 14px/1 var(--sans);border-radius:10px;cursor:pointer}
.rem{display:flex;align-items:center;gap:12px;min-height:48px;margin:6px 0 8px;font-size:16px;color:var(--ink-2);cursor:pointer}.rem input{width:22px;height:22px;margin:0;accent-color:var(--gold);flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 22px;border:0;border-radius:14px;font:700 17px/1.1 var(--sans);cursor:pointer;background:var(--ink);color:var(--paper)}
.btn[aria-busy=true]{opacity:.8;cursor:progress}.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:none}.btn[aria-busy=true] .spin{display:block}@keyframes sp{to{transform:rotate(360deg)}}
.msg{margin:12px 0 0;font-size:15px;line-height:1.4;color:var(--err)}.msg:empty{display:none}
.home{justify-self:center;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:var(--gold-text);font-weight:600;font-size:15px;text-decoration:none;border-radius:10px}.home:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head>
