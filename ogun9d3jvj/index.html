<style>:root{--bg:#f3f2ef;--card:#fff;--ink:#16181d;--ink-2:#4a4e57;--line:#8e8a82;--gold:#d39e1c;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1b1e24;--ink:#f1f0ec;--ink-2:#b9bcc4;--line:#6b707a;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{background:var(--card);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;display:grid;gap:14px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}h1{margin:0;font-size:26px;line-height:1.15}p{margin:0;color:var(--ink-2)}
input{font:inherit;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);width:100%}
input:focus,button:focus{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);min-height:50px;cursor:pointer}
#e{color:var(--err);min-height:1.4em;font-size:15px}label{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink-2)}label input{width:auto}</style></head>
